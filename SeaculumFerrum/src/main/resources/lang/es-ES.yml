wb_jails_2: "Asegúrese de que su ciudad tenga al menos una parcela de cárcel. Los prisioneros de guerra serán enviados a la cárcel principal de su ciudad."
wb_jails_3: "Puede establecer la cárcel principal de su ciudad usando /Town Set PrimaryJail mientras está parado en una de las parcelas de la cárcel de su ciudad."
wb_jails_4: "Cuando un atacante ha sido asesinado en tus tierras y tienes una parcela de cárcel que no ha caído a 0 HP a 0, ese atacante se convierte en prisionero de guerra."
wb_jails_5: "Se generarán en la cárcel y permanecerán allí, incapaces de anotar puntos o atacar a los bloqueos de la ciudad hasta que hayan sido liberados."
wb_jails_6: "Para ser liberado, el jugador tiene algunas opciones: "
wb_jails_7: "- En una guerra antidisturbios tienen que salir de la trama de la cárcel."
wb_jails_8: "- En cualquier otro tipo de guerra, tienen que escapar al desierto."
wb_jails_9: "- Si los atacantes caen a 0 HP de la trama de la cárcel a 0 HP, ocurrirá un descanso en la cárcel y todos encarcelados allí serán liberados."

