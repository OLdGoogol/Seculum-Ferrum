wb_jails: "Cárcel: "

wb_jails_1: "Las tramas de la cárcel de Towny se utilizarán para albergar a los enemigos atacantes que han sido asesinados en una ciudad enemiga."
wb_jails_10: "Este servidor permite que las explosiones se regeneren en las ciudades que están en guerra, los atacantes deben intentar usar sus explosivos para tratar de romper las paredes de las parcelas de la cárcel, para liberar a sus compañeros de equipo encarcelados. Block se regenerará después de 60 segundos, así que asegúrese de ser rápido."
